  attention_implementation: mechet_xformers_causal
  bf16: false
  fp16: true
  tf32: false
  learning_rate: 2.0e-5
  num_train_epochs: 1
  max_steps: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
