model_name_or_path: Qwen/Qwen3-0.6B
train_file: data/mechet_proof_clean/train.jsonl
output_dir: outputs/agent/inverse_trl_grpo
forward_checkpoint: null
forward_device: cpu
limit_examples: 0

training:
  learning_rate: 5.0e-6
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_generations: 8
  max_completion_length: 2048
  max_tool_calling_iterations: 8
  temperature: 0.9
  top_p: 0.95
  beta: 0.02
  use_vllm: false
  trust_remote_code: true
  logging_steps: 1
  save_steps: 100
  enable_thinking: true
  report_to: []

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

environment:
  max_tool_calls: 12
  formal_success: 1.0
  formal_failure: -4.0
  endpoint_exact: 2.0
  successful_step: 0.05
  successful_step_cap: 3
  failed_step_penalty: 0.25
  tool_use_bonus: 0.25
  no_tool_penalty: 0.25
  forward_reward_scale: 0.5
  abstain_reward: -0.25
  unfinished_reward: -4.0
  require_tool_use: true
