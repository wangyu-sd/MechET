condition_name: flower_inverse_trace_no_knowledge
scientific_hypothesis: flower_only_inverse_trace_pretraining_h20_replica
model_name_or_path: Qwen/Qwen3-8B
train_file: data/flower_inverse_tool_sft/train.jsonl
validation_file: data/flower_inverse_tool_sft/valid.jsonl
test_file: data/flower_inverse_tool_sft/test.jsonl
output_dir: outputs/agent/tool_sft_flower_inverse_qwen3_8b_h20_run_20260812
limit_examples: 0

# Frozen FlowER test contains three valid traces longer than the generic
# 12-call default (maximum required calls: 20). Keep enough inference budget
# to evaluate those rows instead of rejecting them before generation.
environment:
  max_tool_calls: 24

training:
  learning_rate: 2.0e-5
  # Default only; the launcher overrides this with NUM_TRAIN_EPOCHS.
  num_train_epochs: 3.0
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  eval_accumulation_steps: 8
  eval_strategy: epoch
  max_length: 20480
  packing: false
  assistant_only_loss: true
  group_by_length: true
  gradient_checkpointing: true
  use_liger_kernel: true
  liger_kernel_config:
    rope: false
    rms_norm: false
    swiglu: false
    cross_entropy: false
    fused_linear_cross_entropy: true
  dataloader_num_workers: 2
  logging_steps: 5
  save_steps: 250
  save_total_limit: 3
  seed: 17
  data_seed: 17
  trust_remote_code: true
  report_to: []
  model_revision: b968826d9c46dd6066d109eabc6255188de91218

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

contract:
  stable_id_manifest: data/flower_inverse_tool_sft/training_manifest.json
  validation_report: outputs/mixed_inverse_overlap/decontaminated_heldout/overlap_summary.json
  require_trace_owned: true
  endpoint_source: environment_owned_trace
  terminal_tool: finish_trace
  free_form_proof_submission: false
  knowledge_direct_reward: false
  corpus_used: false
  source_dataset: flower_mech_proof
  environment_revision: trace_owned_move_replay_v2
  executor_revision: MECH_PROOF_v1_move_bound
  exact_structural_train_heldout_overlap: 0
  real_overfit_smoke_test_required: true
  rl_after_supervised_signal_only: true
