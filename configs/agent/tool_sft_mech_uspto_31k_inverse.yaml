condition_name: mech_uspto_31k_trace_no_knowledge
scientific_hypothesis: inverse_trace_pretraining_and_h1_pilot
model_name_or_path: Qwen/Qwen3-0.6B
train_file: data/mech_uspto_31k_inverse_tool_sft/train.jsonl
validation_file: data/mech_uspto_31k_inverse_tool_sft/valid.jsonl
test_file: data/mech_uspto_31k_inverse_tool_sft/test.jsonl
output_dir: outputs/agent/tool_sft_mech_uspto_31k_inverse_qwen3_0_6b
limit_examples: 0

training:
  learning_rate: 2.0e-5
  num_train_epochs: 1.0
  max_steps: -1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 12288
  packing: false
  assistant_only_loss: true
  group_by_length: true
  logging_steps: 1
  save_steps: 100
  trust_remote_code: true
  report_to: []
  model_revision: c1899de289a04d12100db370d81485cdf75e47ca

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

contract:
  stable_id_manifest: data/mech_uspto_31k_inverse_tool_sft/manifest.json
  validation_report: data/mech_uspto_31k_inverse_tool_sft/validation.json
  require_trace_owned: true
  endpoint_source: environment_owned_trace
  terminal_tool: finish_trace
  free_form_proof_submission: false
  knowledge_direct_reward: false
  corpus_used: false
  source_dataset: mech_uspto_31k
  environment_revision: trace_owned_move_replay_v2
  executor_revision: MECH_PROOF_v1_move_bound
  real_overfit_smoke_test_required: true
  smoke_command: >-
    python scripts/train_tool_sft.py --config
    configs/agent/tool_sft_mech_uspto_31k_inverse.yaml
    --limit 32 --max-steps 100
  rl_after_supervised_signal_only: true
