# CPU smoke-test configuration; not a paper model.
train_file: data/forward_expert/steps/train.jsonl
validation_file: data/forward_expert/steps/valid.jsonl
output_dir: outputs/forward_expert/tiny
seed: 17
model:
  hidden_dim: 32
  num_layers: 2
  condition_dim: 64
  dropout: 0.0
epochs: 2
learning_rate: 0.001
weight_decay: 0.0
gradient_accumulation_steps: 1
max_grad_norm: 1.0
limit_train: 16
limit_validation: 16
loss_weights:
  source: 1.0
  sink: 1.0
  reaction: 1.0
  rank: 0.5
  margin_value: 0.2
