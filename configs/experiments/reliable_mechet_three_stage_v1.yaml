version: 1
name: reliable_mechet_three_stage_v1
status: frozen_design_before_training

scientific_question: >-
  Can reverse electron-flow prediction reduce hallucinated retrosynthetic
  reactions while preserving useful one-step prediction and improving
  multi-step planning?

model_policy:
  primary:
    model: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    role: full_three_stage_primary
  confirmation:
    model: Qwen/Qwen3-1.7B
    role: final_key_comparison_only
  historical:
    model: Qwen/Qwen3-8B
    role: lineage_and_failure_diagnosis_no_full_rerun_required

stages:
  stage1_state_sft:
    config: configs/agent/natural_language_event_v2_qwen3_0_6b.yaml
    input_contract: target_current_state_inventory_v2
    output_decisions: [import_fragment, reverse_electron_flow, finish]
    epoch_budget: 1
  stage2_trajectory_sft:
    config: configs/agent/natural_language_history_v2_qwen3_0_6b.yaml
    parent: stage1_state_sft
    input_contract: target_current_state_inventory_compact_history_v2
    epoch_budget: 1
  stage3_earho:
    config: configs/agent/earho_reliable_mechet_qwen3_0_6b.yaml
    parent: stage2_trajectory_sft
    requires_frozen_parent_sha: true
    bounded_post_training: true

data:
  flowER_endpoint: {train: 257171, valid: 2890, test: 28971}
  flowER_strict_program: {train: 257167, valid: 2890, test: 28967}
  headline_endpoint_denominator: 28971
  process_analysis_denominator: 28967

reliability:
  failure_categories:
    - fragment_proposal
    - source_sink_grounding
    - formal_execution
    - executable_wrong_successor
    - termination
  metrics:
    - structural_endpoint_pass_at_1
    - structural_endpoint_pass_at_5
    - structural_endpoint_pass_at_10
    - process_reliable_endpoint_recovery
    - mechanistic_hallucination_rate
    - high_confidence_hallucination_rate
    - first_divergence_depth
    - risk_coverage
    - failure_cause_distribution

controls:
  - endpoint_only
  - net_edit
  - one_shot_open_loop_electron_flow
  - historical_qwen3_8b_sequential_mechet

multistep:
  planner: RetroStar
  implementation: Syntheseus
  same_candidate_budget: true
  same_stock: true
  same_search_budget: true
  metrics:
    - solved_rate
    - hallucinated_edge_rate
    - all_edge_executable_route_rate
    - certified_route_rate
    - wasted_expansion_ratio
    - calls_to_first_solution
    - time_to_first_solution

provenance:
  stage1_manifest_required: true
  stage2_parent_adapter_sha_required: true
  stage3_parent_adapter_sha_required: true
  prediction_sha_required: true
  evaluator_revision_required: true
  missing_predictions_are_failures: true
