suite_id: mechet-evidence-ablation-v2
scientific_question: >-
  Does external mechanistic evidence improve induction of a causally grounded
  electron-flow program beyond trace ownership and extra context alone?
output_dir: data/knowledge_ablation/v2

conditions:
  trace_textbook_rag:
    input: data/textbook_tool_sft/train.jsonl
    knowledge: natural_language_textbook
    environment: trace_owned
    query_contract: target_state_terms_only

  trace_text_plus_anchors:
    input: data/textbook_tool_sft/train_text_and_anchors.jsonl
    knowledge: natural_language_textbook_and_structured_anchors
    environment: trace_owned
    query_contract: target_state_terms_only

  trace_no_knowledge:
    derive_from: trace_textbook_rag
    transform: strip_knowledge
    knowledge: none
    environment: trace_owned

  trace_length_matched_irrelevant:
    derive_from: trace_textbook_rag
    transform: length_matched_irrelevant
    knowledge: irrelevant_text_same_character_budget
    environment: trace_owned

  trace_structured_anchors:
    derive_from: trace_text_plus_anchors
    transform: strip_textbook_keep_anchors
    knowledge: structured_mechanistic_anchors
    environment: trace_owned

  direct_textbook_rag:
    derive_from: trace_textbook_rag
    transform: direct_answer_from_textbook
    knowledge: same_bounded_natural_language_textbook
    environment: direct_answer

training_contract:
  model_family: Qwen3
  scales: [0.6B, 1.7B, 8B]
  same_tokenizer_revision: true
  same_stable_id_intersection: true
  same_optimizer_schedule: true
  same_lora_rank: true
  same_training_updates: true
  raw_assistant_token_equality_assumed: false
  supervised_token_budget_policy: >-
    Measure real tokenizer input and assistant-mask tokens for every condition;
    report token-normalized compute and use explicit sampling/update multipliers
    when cumulative supervised-token matching is required.
  exact_textbook_character_budget_for_text_conditions: true
  matched_tool_call_budget_for_trace_conditions: true
  evidence_retrieval_direct_reward: false
  primary_stage: supervised_tool_sft_before_rl
  seeds: [17, 29, 43]

evaluation_contract:
  frozen_reference_ids_required: true
  missing_prediction_policy: count_as_failure
  duplicate_or_extra_prediction_policy: hard_error
  recompute_trace_and_proof_metrics: true
  primary_endpoint: structural_precursor_exact_ignore_maps
  secondary_endpoint: mapped_structural_precursor_exact
  primary_metrics:
    - structural_precursor_top1
    - structural_precursor_top5
    - mapped_structural_precursor_top1
    - execute_rate
    - trace_endpoint_consistency
    - tool_failure_recovery
    - abstention_risk_coverage
  knowledge_metrics:
    - retrieval_recall_at_k
    - retrieval_precision_at_k
    - passage_rank
    - context_characters
    - tokenizer_input_tokens
    - tokenizer_supervised_tokens
    - retrieval_latency
    - citation_correctness
  evidence_interventions:
    - passage_shuffle
    - same_topic_wrong
    - remove_warnings
    - remove_competing_pathways
  causal_trace_interventions:
    - remove_tool_observations
    - stale_tool_observations
    - shuffle_tool_observations
    - disable_inspect_state
    - disable_intermediate_execution
  ood_conditions:
    - source_sink_primitive_composition_holdout
    - reaction_family_holdout
    - product_scaffold_holdout
    - temporal_holdout
  claim_gate: >-
    Textbook gains must exceed both trace-only and length-matched irrelevant
    context under the frozen ID universe, and the trace-owned path must remain
    fully re-executable and causally sensitive to tool-observation interventions.
