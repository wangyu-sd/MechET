schema_version: 1
benchmark_id: organic-textbook-and-gas-phase-evidence-eval-v1
status: development

assets:
  textbook_corpus: knowledge/organic_textbook_corpus_v2/passages.jsonl
  textbook_manifest: knowledge/organic_textbook_corpus_v2/passages.manifest.json
  spectral_records: knowledge/spectral_evidence_v1/records.jsonl
  spectral_manifest: knowledge/spectral_evidence_v1/manifest.json
  openstax_text_only_questions: data/openstax_organic_eval_v1/text_only_questions.jsonl
  openstax_answer_key: data/openstax_organic_eval_v1/answer_key.jsonl

evaluation_tracks:
  retrieval:
    query_strata:
      - molecular_state_queries
      - named_concept_queries
      - mechanism_family_queries
      - gas_phase_and_mass_spectrometry_queries
      - adversarial_same_topic_wrong_mechanism
    minimum_human_reviewed_queries_per_stratum: 40
    metrics: [Recall@1, Recall@4, Recall@10, MRR, nDCG@10, source_diversity, citation_precision]
    null_controls: [empty_query, length_matched_irrelevant, same_topic_wrong]

  open_textbook_questions:
    source: OpenStax additional problems and answer keys held out from retrieval corpus
    inclusion: text-only questions with independently checked answer keys
    exclude: [figure_dependent, ambiguous, answer_in_question, copyright_incompatible]
    conditions:
      - closed_book
      - length_matched_irrelevant
      - retrieved_textbook
      - oracle_section_upper_bound
    metrics: [exact_or_numeric, rubric_score, citation_correctness, calibration, abstention_coverage]
    split_contract:
      development: chapters 1-24
      validation: chapters 25-27
      frozen_test: chapters 28-31
      inference_reads_answer_key: false
      formal_scoring_requires_review_status: approved

  mechet_h3:
    dataset: FlowER replay-verified proof test universe
    conditions:
      - trace_no_knowledge
      - trace_length_matched_irrelevant
      - trace_textbook_rag
      - trace_structured_anchors
      - trace_text_plus_anchors
      - direct_textbook_rag
    primary_metrics: [structural_exact, executable_finish_rate, trace_endpoint_consistency]
    evidence_metrics: [passage_sensitivity, citation_precision, retrieval_recall]
    forbidden: [evidence_reward, label_oracle_as_headline, changing_corpus_after_test]

  mass_spectrometry:
    dataset: MassBank 2026.03
    regimes_reported_separately:
      - EI_radical_cation
      - ESI_positive_MS2
      - ESI_negative_MS2
      - other_ionization
    tasks:
      library_retrieval:
        input: peak list plus permitted acquisition metadata
        output: ranked library structures
        metrics: [top1_inchikey_connectivity, top5, top10, mean_reciprocal_rank, scaffold_tanimoto]
      molecular_formula:
        input: precursor m/z, isotope information when present, peak list
        output: ranked formula
        metrics: [formula_exact_top1, formula_top5, mass_error_ppm]
      structure_prediction:
        input: spectrum and declared metadata
        output: ranked structures
        metrics: [inchikey_connectivity_topk, fingerprint_tanimoto, formula_consistency]
      fragmentation_explanation:
        input: structure plus spectrum
        output: fragment formulas, neutral losses and evidence-linked explanation
        metrics: [explained_intensity, peak_recall, formula_mass_balance, unsupported_claim_rate]
    split_contract:
      primary: Bemis-Murcko scaffold held out with acyclic compound fallback
      secondary: exact connectivity identity held out
      no_same_compound_cross_split: true
      secondary_stress_tests: [instrument_held_out, collision_energy_held_out, laboratory_held_out]
    warning: Solution-phase MechET electron moves are not a formal validator for radical-ion gas-phase fragmentation.

freeze:
  before_any_frozen_test:
    - source and license registries
    - corpus and spectral hashes
    - question IDs and rubrics
    - split membership
    - query generator
    - retrieval parameters and context budget
    - model checkpoint and decoding parameters
