condition_name: direct_textbook_rag
scientific_hypothesis: H3_empirical_evidence_separation
model_name_or_path: Qwen/Qwen3-0.6B
train_file: data/knowledge_ablation/v2/train/direct_textbook_rag.jsonl
output_dir: outputs/agent/tool_sft_direct_textbook_qwen3_0_6b
limit_examples: 0

training:
  learning_rate: 2.0e-5
  num_train_epochs: 1.0
  max_steps: -1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 12288
  packing: false
  assistant_only_loss: true
  group_by_length: true
  logging_steps: 1
  save_steps: 100
  trust_remote_code: true
  report_to: []
  model_revision: main

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

contract:
  stable_id_manifest: data/knowledge_ablation/v2/train/manifest.json
  validation_report: outputs/contracts/evidence_conditions_train.json
  require_trace_owned: false
  endpoint_source: direct_answer
  terminal_tool: null
  free_form_proof_submission: null
  knowledge_direct_reward: false
  environment_revision: direct_open_book_v2
  executor_revision: not_applicable
  matched_against:
    - trace_textbook_rag
  real_overfit_smoke_test_required: true
  smoke_command: >-
    python scripts/train_tool_sft.py --config
    configs/knowledge/tool_sft_direct_textbook.yaml --limit 32 --max-steps 100
  rl_after_supervised_signal_only: false
