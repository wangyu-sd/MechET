scientific_hypothesis: H3_empirical_evidence_separation
condition_name: trace_textbook_rag
evidence_mode: textbook
model_name_or_path: Qwen/Qwen3-0.6B
initial_adapter_path: outputs/agent/tool_sft_textbook_qwen3_0_6b
initial_adapter_manifest: outputs/agent/tool_sft_textbook_qwen3_0_6b/adapter_manifest.json
initial_adapter_sha256: auto
require_initial_adapter: true
evidence_suite_manifest: data/knowledge_ablation/v2/manifest.json
environment_revision: knowledge_trace_owned_move_replay_v2
executor_revision: MECH_PROOF_v1_move_bound
train_file: data/knowledge_ablation/v2/trace_textbook_rag.jsonl
output_dir: outputs/agent/inverse_textbook_trace_grpo
textbook_corpus_path: knowledge/corpus/passages.jsonl
primitive_library_path: knowledge/primitives/core_polar_primitives.yaml
primitive_source_registry_path: knowledge/source_registry.yaml
forward_checkpoint: ""
forward_device: cpu
limit_examples: 0

environment:
  max_tool_calls: 16
  formal_success: 1.0
  formal_failure: -4.0
  endpoint_exact: 2.0
  successful_step: 0.05
  successful_step_cap: 3
  failed_step_penalty: 0.25
  tool_use_bonus: 0.0
  no_tool_penalty: 0.5
  forward_reward_scale: 0.0
  abstain_reward: -0.25
  unfinished_reward: -4.0
  require_tool_use: true
  require_textbook_corpus: true
  auto_textbook_on_reset: false
  textbook_top_k: 4
  textbook_max_characters: 5000
  textbook_max_passage_characters: 1200
  textbook_max_per_source: 2
  enable_structured_primitives: false
  primitive_top_k: 4

training:
  seed: 17
  data_seed: 17
  learning_rate: 5.0e-6
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_generations: 8
  max_completion_length: 2048
  max_tool_calling_iterations: 16
  temperature: 0.9
  top_p: 0.95
  beta: 0.02
  use_vllm: false
  logging_steps: 1
  save_steps: 100
  enable_thinking: true
  trust_remote_code: true
  report_to: []

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
