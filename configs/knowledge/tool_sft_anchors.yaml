condition_name: trace_structured_anchors
scientific_hypothesis: H3_empirical_evidence_separation
model_name_or_path: Qwen/Qwen3-0.6B
train_file: data/knowledge_ablation/v2/trace_structured_anchors.jsonl
output_dir: outputs/agent/tool_sft_anchors_qwen3_0_6b
limit_examples: 0

training:
  learning_rate: 2.0e-5
  num_train_epochs: 1.0
  max_steps: -1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 4096
  packing: false
  assistant_only_loss: true
  logging_steps: 1
  save_steps: 100
  trust_remote_code: true
  report_to: []

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

contract:
  stable_id_manifest: data/knowledge_ablation/v2/manifest.json
  validation_report: outputs/contracts/evidence_conditions.json
  require_trace_owned: true
  endpoint_source: environment_owned_trace
  terminal_tool: finish_trace
  free_form_proof_submission: false
  knowledge_direct_reward: false
  environment_revision: anchor_trace_owned_move_replay_v2
  executor_revision: MECH_PROOF_v1_move_bound
  matched_against:
    - trace_no_knowledge
    - trace_text_plus_anchors
  real_overfit_smoke_test_required: true
  smoke_command: >-
    python scripts/train_tool_sft.py --config
    configs/knowledge/tool_sft_anchors.yaml --limit 32 --max-steps 100
  rl_after_supervised_signal_only: true
