schema_version: 1
metadata:
  purpose: Provenance, license, and quality registry for mechanistic references
  policy: Downloaded text is evidence for candidate extraction, not automatic chemical truth.
sources:
  iupac_goldbook_terms:
    title: IUPAC Compendium of Chemical Terminology (Gold Book)
    source_type: terminology
    downloader: iupac_goldbook_terms
    license: CC-BY-SA-4.0-individual-terms
    redistribution: individual_terms_only
    commercial_use: contact_iupac_for_collection
    base_url: https://goldbook.iupac.org/terms/view/{term_id}/json
    terms:
      - N04249
      - N04251
      - E02020
      - E02021
      - L03493
      - E02035
      - H02809
      - I03096
      - S06078
      - "08191"
    term_aliases:
      R05171: I03096
    homepage: https://goldbook.iupac.org
    quality:
      quality_status: reviewed
      retrieval_weight: 1.0
      review_warning: false
      scientific_scope: [terminology, formal definitions]
      allowed_uses: [terminology, provenance, definition evidence]
      disallowed_uses: [mechanism_ground_truth, selectivity_claim, feasibility_claim]
      quality_notes: Individual terms are authoritative terminology, not reaction-specific mechanistic evidence.

  rxno:
    title: Name Reaction Ontology
    source_type: ontology
    downloader: url
    license: CC-BY-4.0
    redistribution: allowed_with_attribution
    urls:
      - https://purl.obolibrary.org/obo/rxno.owl
    homepage: https://obofoundry.org/ontology/rxno.html
    quality:
      quality_status: reviewed
      retrieval_weight: 0.9
      review_warning: false
      scientific_scope: [reaction terminology, ontology]
      allowed_uses: [terminology, reaction-family indexing, provenance]
      disallowed_uses: [mechanism_ground_truth, selectivity_claim, feasibility_claim]

  wikibooks_organic_chemistry:
    title: Wikibooks Organic Chemistry
    source_type: open_textbook
    downloader: mediawiki_pages
    license: CC-BY-SA-4.0-and-GFDL-unless-noted
    redistribution: text_allowed_with_attribution_and_sharealike
    api_url: https://en.wikibooks.org/w/api.php
    rest_api_url: https://api.wikimedia.org/core/v1/wikibooks/en/page/{title}
    export_url: https://en.wikibooks.org/wiki/Special:Export/{title}
    raw_url: https://en.wikibooks.org/w/index.php?title={title}&action=raw
    page_url: https://en.wikibooks.org/wiki/{title}
    backend_order:
      - rest
      - action_api
      - export
      - raw
    pages:
      - Organic Chemistry/Introduction to reactions/Overview of addition, elimination, substitution and rearrangement reactions
      - Organic Chemistry/Introduction to reactions/Review of nucleophilic substitution
      - Organic Chemistry/Alkenes
      - Organic Chemistry/Aromatic reactions
      - Organic Chemistry/Ketones and aldehydes
      - Organic Chemistry/Carboxylic acids
    exclude_media: true
    homepage: https://en.wikibooks.org/wiki/Organic_Chemistry
    quality:
      quality_status: usable_with_caution
      retrieval_weight: 0.65
      review_warning: true
      scientific_scope: [introductory organic chemistry, qualitative mechanisms]
      allowed_uses: [broad_context, terminology, candidate_mechanistic_evidence]
      disallowed_uses: [mechanism_ground_truth, selectivity_claim, feasibility_claim]
      quality_notes: Community-authored educational text; passage-level review is required before headline H3 use.
    page_quality:
      Organic Chemistry/Introduction to reactions/Overview of addition, elimination, substitution and rearrangement reactions:
        quality_status: low_priority
        retrieval_weight: 0.35
        review_warning: true
        scientific_scope: [introductory reaction classification]
        allowed_uses: [broad_context, terminology]
        disallowed_uses: [mechanism_ground_truth, selectivity_claim, feasibility_claim]
        quality_notes: Introductory overview with limited mechanistic detail.
      Organic Chemistry/Introduction to reactions/Review of nucleophilic substitution:
        quality_status: usable_with_caution
        retrieval_weight: 0.65
        review_warning: true
        scientific_scope: [nucleophilic substitution, qualitative mechanism]
        allowed_uses: [broad_context, candidate_mechanistic_evidence]
        disallowed_uses: [mechanism_ground_truth, selectivity_claim, feasibility_claim]
      Organic Chemistry/Alkenes:
        quality_status: usable_with_caution
        retrieval_weight: 0.65
        review_warning: true
        scientific_scope: [alkene chemistry, qualitative additions]
        allowed_uses: [broad_context, candidate_mechanistic_evidence]
        disallowed_uses: [mechanism_ground_truth, selectivity_claim, feasibility_claim]
      Organic Chemistry/Aromatic reactions:
        quality_status: usable_with_caution
        retrieval_weight: 0.65
        review_warning: true
        scientific_scope: [aromatic reactions, qualitative mechanisms]
        allowed_uses: [broad_context, candidate_mechanistic_evidence]
        disallowed_uses: [mechanism_ground_truth, selectivity_claim, feasibility_claim]
      Organic Chemistry/Ketones and aldehydes:
        quality_status: usable_with_caution
        retrieval_weight: 0.75
        review_warning: true
        scientific_scope: [carbonyl chemistry, aldehydes, ketones, nucleophilic addition]
        allowed_uses: [broad_context, candidate_mechanistic_evidence]
        disallowed_uses: [mechanism_ground_truth, selectivity_claim, feasibility_claim]
      Organic Chemistry/Carboxylic acids:
        quality_status: usable_with_caution
        retrieval_weight: 0.75
        review_warning: true
        scientific_scope: [carboxylic acids, acyl chemistry]
        allowed_uses: [broad_context, candidate_mechanistic_evidence]
        disallowed_uses: [mechanism_ground_truth, selectivity_claim, feasibility_claim]

  libretexts_organic_synthesis_shea:
    title: Organic Synthesis (Shea)
    source_type: open_textbook
    downloader: html_pages
    license: CC-BY-4.0
    redistribution: text_allowed_with_attribution
    expected_license_markers:
      - CC BY
      - license:ccby
    pages:
      - https://chem.libretexts.org/Bookshelves/Organic_Chemistry/Organic_Synthesis_%28Shea%29
      - https://chem.libretexts.org/Bookshelves/Organic_Chemistry/Organic_Synthesis_%28Shea%29/00%3A_Front_Matter/04%3A_Licensing
    text_only: true
    homepage: https://chem.libretexts.org/Bookshelves/Organic_Chemistry/Organic_Synthesis_%28Shea%29
    quality:
      quality_status: usable_with_caution
      retrieval_weight: 0.8
      review_warning: true
      scientific_scope: [organic synthesis, qualitative reaction guidance]
      allowed_uses: [broad_context, candidate_mechanistic_evidence]
      disallowed_uses: [mechanism_ground_truth, selectivity_claim, feasibility_claim]

  mit_ocw_organic_chemistry:
    title: MIT OpenCourseWare Organic Chemistry I and II
    source_type: course_materials
    downloader: html_pages
    license: CC-BY-NC-SA-4.0-except-marked-third-party-content
    redistribution: noncommercial_only
    requires_noncommercial_acceptance: true
    expected_license_markers:
      - CC BY-NC-SA
      - Creative Commons
    pages:
      - https://ocw.mit.edu/courses/5-12-organic-chemistry-i-spring-2005/
      - https://ocw.mit.edu/courses/5-13-organic-chemistry-ii-fall-2006/
      - https://ocw.mit.edu/pages/privacy-and-terms-of-use/
    text_only: true
    exclude_markers:
      - All rights reserved
    homepage: https://ocw.mit.edu
    quality:
      quality_status: usable_with_caution
      retrieval_weight: 0.85
      review_warning: true
      scientific_scope: [university course materials, organic chemistry]
      allowed_uses: [broad_context, candidate_mechanistic_evidence, noncommercial_research]
      disallowed_uses: [mechanism_ground_truth, selectivity_claim, feasibility_claim, commercial_redistribution]

  pmechdb_pmechrp:
    title: PMechDB and PMechRP datasets
    source_type: mechanism_dataset
    downloader: manual_gate
    license: CC-BY-NC-ND
    redistribution: unmodified_only_noncommercial
    requires_noncommercial_acceptance: true
    requires_restricted_acceptance: true
    request_url: https://deeprxn.ics.uci.edu/pmechdb/download
    notes:
      - Includes elementary polar steps and a 350-pathway textbook benchmark.
      - Do not automatically publish converted or modified derivatives without permission.
    quality:
      quality_status: reviewed
      retrieval_weight: 1.0
      review_warning: false
      scientific_scope: [mechanism dataset, textbook pathways]
      allowed_uses: [noncommercial_research, benchmark_under_license]
      disallowed_uses: [modified_redistribution, commercial_use_without_permission]
