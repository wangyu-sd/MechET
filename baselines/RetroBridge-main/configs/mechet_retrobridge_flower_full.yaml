# Full FlowER configuration. Data preparation explicitly excludes the source
# mapping anomalies listed in audits/mechet_retrobridge/flower_full and records
# the changed train/test denominators in metadata.json.
experiment_name: mechet_retrobridge_flower_full
checkpoints: /data/pxy/models/RetroBridge/flower_full/checkpoints
logs: /data/pxy/models/RetroBridge/flower_full/logs
data: /data/pxy/data/RetroBridge
swanlab_project: RetroBridge
swanlab_workspace: null
swanlab_mode: online
seed: 42
device: gpu

sample_every_val: 20
log_every_steps: 50
samples_to_generate: 128
samples_to_save: 128
samples_per_input: 5
chains_to_save: 5
number_chain_steps_to_save: 50
enable_progress_bar: true

dataset: flower_full
batch_size: 16
accumulate_grad_batches: 4
num_workers: 8
shuffle: true
extra_nodes: true
swap: false

diffusion_steps: 500
diffusion_noise_schedule: cosine
transition: null
fix_product_nodes: true

use_context: true
extra_features: all
extra_molecular_features: false
n_layers: 5
hidden_mlp_dims: {'X': 256, 'E': 128, 'y': 128}
hidden_dims: {'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 128, 'dim_ffy': 128}

n_epochs: 1000
lambda_train: [5, 0]
lr: 0.0002
weight_decay: 0.000000000001
loss_type: vlb

resume:
