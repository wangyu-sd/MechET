# Milestone-2 smoke test only; this is not the full benchmark configuration.
experiment_name: mechet_retrobridge_flower_overfit32
checkpoints: audits/mechet_retrobridge/flower_full/runs/checkpoints
logs: audits/mechet_retrobridge/flower_full/runs/logs
data: audits/mechet_retrobridge/flower_full/data
swanlab_project: RetroBridge
swanlab_workspace: null
swanlab_mode: online
seed: 42
device: gpu

sample_every_val: 1000
log_every_steps: 1
samples_to_generate: 32
samples_to_save: 0
samples_per_input: 3
chains_to_save: 0
number_chain_steps_to_save: 1
enable_progress_bar: true

dataset: overfit32
batch_size: 4
num_workers: 0
shuffle: true
extra_nodes: true
swap: false

