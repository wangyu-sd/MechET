diffusion_steps: 100
diffusion_noise_schedule: cosine
transition: null
fix_product_nodes: true

use_context: true
extra_features: null
extra_molecular_features: false
n_layers: 3
hidden_mlp_dims: {'X': 128, 'E': 64, 'y': 64}
hidden_dims: {'dx': 128, 'de': 32, 'dy': 32, 'n_head': 8, 'dim_ffX': 128, 'dim_ffE': 64, 'dim_ffy': 64}

n_epochs: 30
lambda_train: [5, 0]
lr: 0.0002
weight_decay: 0.000000000001
loss_type: vlb

resume:
