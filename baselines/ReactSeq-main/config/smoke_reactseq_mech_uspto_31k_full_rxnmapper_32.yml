data:
  corpus_1:
    path_src: datasets/mechet_reactseq_smoke/mech_uspto_31k_full_rxnmapper_32/train/src.txt
    path_tgt: datasets/mechet_reactseq_smoke/mech_uspto_31k_full_rxnmapper_32/train/tgt.txt
  valid:
    path_src: datasets/mechet_reactseq_smoke/mech_uspto_31k_full_rxnmapper_32/valid/src.txt
    path_tgt: datasets/mechet_reactseq_smoke/mech_uspto_31k_full_rxnmapper_32/valid/tgt.txt

n_sample: 0
save_data: /tmp/reactseq_smoke/mech_uspto_31k_full_rxnmapper_32/vocab
src_vocab: datasets/vocabs/whole_vocabs.src
tgt_vocab: datasets/vocabs/whole_vocabs.src
share_vocab: true
src_seq_length: 500
tgt_seq_length: 500
overwrite: true

tensorboard: false
log_file: /tmp/reactseq_smoke/mech_uspto_31k_full_rxnmapper_32/train.log
save_model: /tmp/reactseq_smoke/mech_uspto_31k_full_rxnmapper_32/model
save_checkpoint_steps: 10
keep_checkpoint: 1
seed: 3435
train_steps: 10
valid_steps: 5
warmup_steps: 10
report_every: 1

decoder_type: transformer
encoder_type: transformer
word_vec_size: 256
hidden_size: 256
layers: 6
transformer_ff: 2048
heads: 8

accum_count: 1
num_workers: 0
bucket_size: 32
optim: adam
adam_beta1: 0.9
adam_beta2: 0.998
decay_method: noam
learning_rate: 1.0
max_grad_norm: 0.0

batch_size: 128
valid_batch_size: 128
batch_type: sents
normalization: sents
dropout: 0.3
attention_dropout: 0.3
label_smoothing: 0.0
max_generator_batches: 0

param_init: 0.0
param_init_glorot: true
position_encoding: true
world_size: 1
gpu_ranks: []
