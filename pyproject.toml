[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechet"
version = "0.1.0"
description = "MechET: Mechanism Electron-Transfer CoT for retrosynthesis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wangyu-sd" }]
dependencies = [
  "rdkit",
  "numpy",
]

[project.optional-dependencies]
train = [
  "torch",
  "transformers",
  "peft",
  "datasets",
  "accelerate",
  "bitsandbytes",
  "pyyaml",
]
forward = [
  "torch>=2.1",
  "pyyaml>=6.0",
]
data = [
  "huggingface_hub>=0.24",
  "datasets>=2.19",
  "pandas>=2.0",
  "pyarrow>=14",
]
mapping = [
  "rxnmapper>=0.4",
]
ord = [
  "ord-schema>=0.6.3",
  "protobuf>=4.25",
]
baselines = [
  "transformers>=4.45",
  "accelerate>=0.34",
  "safetensors>=0.4",
]
agent = [
  "torch>=2.1",
  "trl>=1.9.1",
  "transformers>=5.2.0",
  "peft>=0.17",
  "datasets>=3.0",
  "accelerate>=1.0",
  "pyyaml>=6.0",
]
planning = [
  "syntheseus>=0.7.2,<0.8",
]
dev = [
  "pytest",
  "mechet[train,forward]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
