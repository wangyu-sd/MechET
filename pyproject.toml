[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechet"
version = "0.1.0"
description = "MechET: causal and compositional electron-flow reasoning for retrosynthesis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wangyu-sd" }]
dependencies = [
  "rdkit",
  "numpy",
]

[project.optional-dependencies]
train = [
  "torch>=2.1",
  "transformers>=5.2,<6",
  "peft>=0.17,<1",
  "datasets>=4.7,<6",
  "accelerate>=1,<2",
  "bitsandbytes",
  "pyyaml>=6.0",
]
forward = [
  "torch>=2.1",
  "pyyaml>=6.0",
]
data = [
  "huggingface_hub>=0.24",
  "datasets>=4.7,<6",
  "pandas>=2.0",
  "pyarrow>=14",
]
mapping = [
  "rxnmapper>=0.4",
]
ord = [
  "ord-schema>=0.6.3",
  "protobuf>=4.25",
]
baselines = [
  "transformers>=5.2,<6",
  "accelerate>=1,<2",
  "safetensors>=0.4",
]
agent = [
  "torch>=2.1",
  "trl>=1.8,<2",
  "transformers>=5.2,<6",
  "peft>=0.17,<1",
  "datasets>=4.7,<6",
  "accelerate>=1,<2",
  "pyyaml>=6.0",
]
knowledge = [
  "pyyaml>=6.0",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "rdflib>=7.0",
]
planning = [
  "syntheseus>=0.7.2,<0.8",
]
dev = [
  "pytest",
  "mechet[train,forward,knowledge]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
