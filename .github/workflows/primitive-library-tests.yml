name: Mechanistic primitive library tests

on:
  pull_request:
    paths:
      - "README.md"
      - "pyproject.toml"
      - "knowledge/**"
      - "docs/MECHANISTIC_PRIMITIVE_LIBRARY.md"
      - "docs/README.md"
      - "src/mechet/primitive_*.py"
      - "src/mechet/textbook_*.py"
      - "src/mechet/source_health.py"
      - "src/mechet/evidence_context.py"
      - "scripts/download_mechanistic_sources.py"
      - "scripts/check_source_health.py"
      - "scripts/build_primitive_extraction_queue.py"
      - "scripts/build_textbook_corpus.py"
      - "scripts/index_textbook_corpus.py"
      - "scripts/annotate_primitive_context.py"
      - "scripts/train_inverse_agent_primitives.py"
      - "configs/knowledge/**"
      - "tests/test_primitive_*.py"
      - "tests/test_source_health.py"
      - "tests/test_textbook_retrieval.py"
      - "tests/test_documentation_contract.py"
      - ".github/workflows/primitive-library-tests.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "pyproject.toml"
      - "knowledge/**"
      - "docs/MECHANISTIC_PRIMITIVE_LIBRARY.md"
      - "docs/README.md"
      - "src/mechet/primitive_*.py"
      - "src/mechet/textbook_*.py"
      - "src/mechet/source_health.py"
      - "src/mechet/evidence_context.py"
      - "scripts/download_mechanistic_sources.py"
      - "scripts/check_source_health.py"
      - "scripts/build_primitive_extraction_queue.py"
      - "scripts/build_textbook_corpus.py"
      - "scripts/index_textbook_corpus.py"
      - "scripts/annotate_primitive_context.py"
      - "scripts/train_inverse_agent_primitives.py"
      - "configs/knowledge/**"
      - "tests/test_primitive_*.py"
      - "tests/test_source_health.py"
      - "tests/test_textbook_retrieval.py"
      - "tests/test_documentation_contract.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,knowledge]"
      - name: Compile primitive and textbook modules
        run: |
          python -m py_compile \
            src/mechet/primitive_library.py \
            src/mechet/primitive_agent_env.py \
            src/mechet/textbook_store.py \
            src/mechet/textbook_retriever.py \
            src/mechet/source_health.py \
            src/mechet/evidence_context.py \
            scripts/download_mechanistic_sources.py \
            scripts/check_source_health.py \
            scripts/build_primitive_extraction_queue.py \
            scripts/build_textbook_corpus.py \
            scripts/index_textbook_corpus.py \
            scripts/annotate_primitive_context.py \
            scripts/train_inverse_agent_primitives.py
      - name: Run primitive, textbook, source-download, and documentation tests
        run: |
          pytest -q \
            tests/test_primitive_library.py \
            tests/test_primitive_agent_env.py \
            tests/test_primitive_source_download.py \
            tests/test_source_health.py \
            tests/test_textbook_retrieval.py \
            tests/test_documentation_contract.py
      - name: Validate source registry and license gates
        run: |
          python scripts/download_mechanistic_sources.py \
            --registry knowledge/source_registry.yaml list --json
          python scripts/download_mechanistic_sources.py \
            --registry knowledge/source_registry.yaml \
            download \
            --source iupac_goldbook_terms \
            --source rxno \
            --source wikibooks_organic_chemistry \
            --source libretexts_organic_synthesis_shea \
            --output /tmp/mechet-knowledge --dry-run
          ! python scripts/download_mechanistic_sources.py \
            --registry knowledge/source_registry.yaml \
            download --source mit_ocw_organic_chemistry \
            --output /tmp/mechet-knowledge --dry-run
          ! python scripts/download_mechanistic_sources.py \
            --registry knowledge/source_registry.yaml \
            download --source pmechdb_pmechrp \
            --output /tmp/mechet-knowledge --dry-run
      - name: Exercise textbook corpus and index build
        run: |
          mkdir -p /tmp/mechet-knowledge/open_textbook/pages
          cat > /tmp/mechet-knowledge/open_textbook/pages/carbonyl.json <<'JSON'
          {"title":"Carbonyl addition","text":"A nucleophile can donate an electron pair to an electrophilic carbonyl carbon while the carbon oxygen pi bond shifts toward oxygen. Steric and electronic effects influence the competing pathways and facial selectivity."}
          JSON
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('/tmp/mechet-knowledge')
          path = root / 'open_textbook/pages/carbonyl.json'
          manifest = {"artifacts":[{"source_id":"open_textbook","path":"pages/carbonyl.json","url":"https://example.org/carbonyl","license":"CC-BY-4.0","sha256":hashlib.sha256(path.read_bytes()).hexdigest(),"status":"downloaded","revision_id":"r1","quality_status":"reviewed","retrieval_weight":1.0,"review_warning":False}]}
          (root/'manifest.json').write_text(json.dumps(manifest))
          PY
          python scripts/build_textbook_corpus.py \
            --download-root /tmp/mechet-knowledge \
            --output /tmp/mechet-knowledge/passages.jsonl
          python scripts/index_textbook_corpus.py \
            --corpus /tmp/mechet-knowledge/passages.jsonl \
            --output /tmp/mechet-knowledge/bm25.json
          grep -q carbonyl /tmp/mechet-knowledge/passages.jsonl
          grep -q quality_status /tmp/mechet-knowledge/passages.jsonl
      - name: Exercise primitive annotation
        run: |
          mkdir -p /tmp/mechet-primitive
          cat > /tmp/mechet-primitive/reactions.jsonl <<'JSONL'
          {"id":"sn2","reactants":"[CH3:1][Br:2].[OH-:3]","products":"[CH3:1][OH:3].[Br-:2]","conditions":{}}
          JSONL
          python scripts/annotate_primitive_context.py \
            --input /tmp/mechet-primitive/reactions.jsonl \
            --output /tmp/mechet-primitive/annotated.jsonl \
            --library knowledge/primitives/core_polar_primitives.yaml \
            --source-registry knowledge/source_registry.yaml \
            --render-context
          grep -q nucleophilic_substitution_sp3 /tmp/mechet-primitive/annotated.jsonl
      - name: Exercise primitive actor dry-run
        run: |
          mkdir -p /tmp/mechet-primitive
          cat > /tmp/mechet-primitive/train.jsonl <<'JSONL'
          {"id":"smoke-1","target_smiles":"[CH3:1][Br:2].[OH-:3]","expected_precursor":"[CH3:1][OH:3].[Br-:2]"}
          JSONL
          cat > /tmp/mechet-primitive/config.yaml <<'YAML'
          model_name_or_path: Qwen/Qwen3-0.6B
          train_file: /tmp/mechet-primitive/train.jsonl
          output_dir: /tmp/mechet-primitive/output
          primitive_library_path: knowledge/primitives/core_polar_primitives.yaml
          primitive_source_registry_path: knowledge/source_registry.yaml
          environment:
            max_tool_calls: 8
            primitive_context_top_k: 4
            primitive_reward_scale: 0.0
          YAML
          python scripts/train_inverse_agent_primitives.py \
            --config /tmp/mechet-primitive/config.yaml --dry-run
