name: Proof program tests

on:
  pull_request:
    paths:
      - "README.md"
      - "src/mechet/__init__.py"
      - "src/mechet/proof_*.py"
      - "src/mechet/structural_overlap.py"
      - "src/mechet/rlvr.py"
      - "scripts/*proof*.py"
      - "scripts/build_mechcomp_ood.py"
      - "tests/test_proof_*.py"
      - "tests/test_structural_overlap.py"
      - ".github/workflows/proof-tests.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "src/mechet/__init__.py"
      - "src/mechet/proof_*.py"
      - "src/mechet/structural_overlap.py"
      - "src/mechet/rlvr.py"
      - "scripts/*proof*.py"
      - "scripts/build_mechcomp_ood.py"
      - "tests/test_proof_*.py"
      - "tests/test_structural_overlap.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install proof-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest torch
      - name: Compile proof modules and scripts
        run: |
          python -m py_compile \
            src/mechet/__init__.py \
            src/mechet/proof_program.py \
            src/mechet/proof_sft.py \
            src/mechet/proof_equivalence.py \
            src/mechet/proof_diagnostics.py \
            src/mechet/proof_splits.py \
            src/mechet/structural_overlap.py \
            src/mechet/rlvr.py \
            scripts/build_mechet_proof_sft.py \
            scripts/build_mechcomp_ood.py \
            scripts/eval_mechet_proof_generations.py \
            scripts/infer_mechet_proof.py \
            scripts/repair_mechet_proof_generations.py
      - name: Run proof tests
        run: pytest -q tests/test_proof_*.py tests/test_structural_overlap.py
