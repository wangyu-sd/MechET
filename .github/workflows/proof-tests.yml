name: Proof program tests

on:
  pull_request:
    paths:
      - "src/mechet/proof_program.py"
      - "src/mechet/proof_sft.py"
      - "src/mechet/rlvr.py"
      - "scripts/*proof*.py"
      - "tests/test_proof_*.py"
      - ".github/workflows/proof-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/mechet/proof_program.py"
      - "src/mechet/proof_sft.py"
      - "src/mechet/rlvr.py"
      - "scripts/*proof*.py"
      - "tests/test_proof_*.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install proof-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest torch
      - name: Compile new modules
        run: |
          python -m py_compile \
            src/mechet/proof_program.py \
            src/mechet/proof_sft.py \
            src/mechet/rlvr.py \
            scripts/build_mechet_proof_sft.py \
            scripts/eval_mechet_proof_generations.py \
            scripts/infer_mechet_proof.py
      - name: Run proof tests
        run: |
          pytest -q \
            tests/test_proof_program.py \
            tests/test_proof_sft.py \
            tests/test_proof_rlvr.py
