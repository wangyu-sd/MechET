name: Docs tests
on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "knowledge/**"
      - "scripts/check_documentation_integrity.py"
      - "tests/test_documentation_contract.py"
      - "tests/test_documentation_integrity.py"
      - "tests/test_integrity_documentation_contract.py"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pyyaml
      - run: pytest -q tests/test_documentation_contract.py tests/test_documentation_integrity.py tests/test_integrity_documentation_contract.py
      - run: python scripts/check_documentation_integrity.py --output outputs/documentation_integrity.json
