name: Evidence intervention isolation tests

on:
  pull_request:
    paths:
      - "scripts/build_evidence_interventions.py"
      - "tests/test_evidence_interventions.py"
      - ".github/workflows/evidence-intervention-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build_evidence_interventions.py"
      - "tests/test_evidence_interventions.py"
      - ".github/workflows/evidence-intervention-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,knowledge]"
      - name: Run evidence intervention isolation tests
        run: pytest -q tests/test_evidence_interventions.py
