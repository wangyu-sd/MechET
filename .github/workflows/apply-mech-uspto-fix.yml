name: Apply mech-USPTO partial-map fix

on:
  push:
    branches: [fix/mech-uspto-partial-maps]
    paths:
      - ".github/workflows/apply-mech-uspto-fix.yml"
      - "scripts/_apply_mech_uspto_fix.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-mech-uspto-fix.yml"
      - "scripts/_apply_mech_uspto_fix.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/mech-uspto-partial-maps' || github.ref_name == 'fix/mech-uspto-partial-maps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mech-uspto-partial-maps
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply minimal source patch
        run: python scripts/_apply_mech_uspto_fix.py
      - name: Validate fix
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[forward]" pytest
          python -m py_compile src/mechet/forward_data.py src/mechet/forward_expert.py
          pytest -q tests/test_forward_expert.py tests/test_mech_uspto_standardization.py
      - name: Commit clean bug fix
        run: |
          rm -f .github/workflows/apply-mech-uspto-fix.yml scripts/_apply_mech_uspto_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mech-USPTO partial atom-map standardization"
          git push origin HEAD:fix/mech-uspto-partial-maps
