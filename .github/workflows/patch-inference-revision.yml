name: Patch inference revision contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-inference-revision.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-data-contract-repair
          fetch-depth: 0
      - name: Patch inference revision handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/infer_mechet.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''from mechet.knowledge_agent_env import KnowledgeAgentConfig\nfrom mechet.tool_schemas import trace_tool_schemas\n'''
          new_import = '''from mechet.knowledge_agent_env import KnowledgeAgentConfig\nfrom mechet.model_revision import resolve_lineage_revision\nfrom mechet.tool_schemas import trace_tool_schemas\n'''
          if old_import not in text:
              raise SystemExit('infer import marker not found')
          text = text.replace(old_import, new_import, 1)

          old_fn = '''def _resolve_revision(\n    cfg: Mapping[str, Any], cli_revision: str, manifest: Mapping[str, Any], *, scripted: bool\n) -> str:\n    training = dict(cfg.get("training") or {})\n    revision = str(\n        cli_revision\n        or training.get("model_revision")\n        or cfg.get("model_revision")\n        or manifest.get("base_model_revision")\n        or manifest.get("model_revision")\n        or ""\n    ).strip()\n    if revision:\n        return revision\n    if scripted:\n        return "scripted"\n    raise ValueError(\n        "non-scripted inference requires a frozen model revision via "\n        "--model-revision, training.model_revision, or adapter_manifest.json"\n    )\n'''
          new_fn = '''def _resolve_revision(\n    cfg: Mapping[str, Any], cli_revision: str, manifest: Mapping[str, Any], *, scripted: bool\n) -> str:\n    if scripted:\n        return "scripted"\n    training = dict(cfg.get("training") or {})\n    configured = str(\n        cli_revision\n        or training.get("model_revision")\n        or cfg.get("model_revision")\n        or ""\n    ).strip()\n    adapter_revision = str(\n        manifest.get("base_model_revision")\n        or manifest.get("model_revision")\n        or ""\n    ).strip()\n    revision = resolve_lineage_revision(configured, adapter_revision)\n    if revision:\n        return revision\n    raise ValueError(\n        "non-scripted inference requires an immutable 40-hex model revision via "\n        "--model-revision or adapter_manifest.json; mutable config aliases such "\n        "as main are not frozen inference revisions"\n    )\n'''
          if old_fn not in text:
              raise SystemExit('infer revision function marker not found')
          text = text.replace(old_fn, new_fn, 1)

          old_tokenizer = '''        tokenizer_revision = str(getattr(tokenizer, "name_or_path", "") or model_revision)\n'''
          new_tokenizer = '''        # The tokenizer is loaded from the same frozen model revision. Preserve the\n        # immutable commit in prediction metadata instead of replacing it with a\n        # mutable repository/model name such as Qwen/Qwen3-0.6B.\n        tokenizer_revision = model_revision\n'''
          if old_tokenizer not in text:
              raise SystemExit('infer tokenizer revision marker not found')
          text = text.replace(old_tokenizer, new_tokenizer, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/infer_mechet.py
      - name: Commit inference patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/infer_mechet.py
          git commit -m 'Freeze inference model and tokenizer revisions'
          git push origin HEAD:agent/runtime-data-contract-repair
