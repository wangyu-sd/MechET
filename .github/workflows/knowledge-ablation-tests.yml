name: Evidence-layer contract tests

on:
  pull_request:
    paths:
      - "README.md"
      - "src/mechet/knowledge_ablation.py"
      - "scripts/build_knowledge_ablation_suite.py"
      - "scripts/validate_experiment_contract.py"
      - "scripts/train_tool_sft.py"
      - "scripts/evaluate_knowledge_ablation.py"
      - "configs/experiments/**"
      - "configs/knowledge/tool_sft_*.yaml"
      - "docs/SCIENTIFIC_THESIS.md"
      - "docs/EXECUTION_PLAN.md"
      - "docs/KNOWLEDGE_ABLATIONS.md"
      - "docs/TOOL_SFT.md"
      - "docs/README.md"
      - "tests/test_knowledge_ablation.py"
      - "tests/test_documentation_contract.py"
      - ".github/workflows/knowledge-ablation-tests.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "src/mechet/knowledge_ablation.py"
      - "scripts/build_knowledge_ablation_suite.py"
      - "scripts/validate_experiment_contract.py"
      - "configs/experiments/**"
      - "docs/**"
      - "tests/test_knowledge_ablation.py"
      - "tests/test_documentation_contract.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[knowledge]" pytest
      - name: Compile scientific contract entrypoints
        run: |
          python -m py_compile \
            src/mechet/knowledge_ablation.py \
            scripts/build_knowledge_ablation_suite.py \
            scripts/validate_experiment_contract.py \
            scripts/train_tool_sft.py \
            scripts/evaluate_knowledge_ablation.py
      - name: Run contract tests
        run: pytest -q tests/test_knowledge_ablation.py tests/test_documentation_contract.py
      - name: Build fully derived synthetic suite
        run: |
          mkdir -p /tmp/mechet-ablation
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('/tmp/mechet-ablation')
          def tool_call(name, call_id):
              return {"role":"assistant","content":"","tool_calls":[{"id":call_id,"type":"function","function":{"name":name,"arguments":"{}"}}]}
          def tool_result(name, result, call_id):
              return {"role":"tool","tool_call_id":call_id,"name":name,"content":json.dumps(result)}
          def row(identifier, target, text, passage, anchors=False):
              context={"text":text,"passage_ids":[passage],"context_sha256":"hash-"+passage,"n_characters":len(text),"truncated":False}
              messages=[
                  {"role":"system","content":"Use trace-owned tools."},
                  {"role":"user","content":"TARGET: "+target},
                  tool_call("retrieve_textbook_guidance","k"),
                  tool_result("retrieve_textbook_guidance",{"ok":True,"query":passage,"state_smiles":target,"context":context,"matches":[{"passage_id":passage}],"direct_reward":False},"k"),
              ]
              if anchors:
                  messages += [tool_call("retrieve_primitives","a"),tool_result("retrieve_primitives",{"ok":True,"matches":[{"primitive_id":passage}],"direct_reward":False},"a")]
              messages += [tool_call("finish_trace","f"),tool_result("finish_trace",{"ok":True,"formal_execute":True,"endpoint_exact":True,"trace_bound":True},"f")]
              return {"id":identifier,"target_smiles":target,"expected_precursor":target,"messages":messages,"metadata":{"endpoint_source":"environment_owned_trace","knowledge_condition":"combined" if anchors else "textbook_rag","textbook_context_characters":len(text),"structured_primitives_enabled":anchors}}
          textbook=[row('r1','[CH4:1]','Carbonyl chemistry evidence.', 'p1'),row('r2','[NH3:2]','Substitution chemistry evidence with a longer passage.', 'p2')]
          combined=[row('r1','[CH4:1]','Carbonyl chemistry evidence.', 'p1', True),row('r2','[NH3:2]','Substitution chemistry evidence with a longer passage.', 'p2', True)]
          for name, rows in [('textbook', textbook), ('combined', combined)]:
              with (root/f'{name}.jsonl').open('w') as handle:
                  for value in rows: handle.write(json.dumps(value)+'\n')
          PY
          cat > /tmp/mechet-ablation/suite.yaml <<'YAML'
          suite_id: smoke
          scientific_question: causal and compositional evidence study
          output_dir: /tmp/mechet-ablation/suite
          conditions:
            trace_textbook_rag:
              input: /tmp/mechet-ablation/textbook.jsonl
            trace_text_plus_anchors:
              input: /tmp/mechet-ablation/combined.jsonl
            trace_no_knowledge:
              derive_from: trace_textbook_rag
              transform: strip_knowledge
            trace_length_matched_irrelevant:
              derive_from: trace_textbook_rag
              transform: length_matched_irrelevant
            trace_structured_anchors:
              derive_from: trace_text_plus_anchors
              transform: strip_textbook_keep_anchors
            direct_textbook_rag:
              derive_from: trace_textbook_rag
              transform: direct_answer_from_textbook
          YAML
          python scripts/build_knowledge_ablation_suite.py \
            --config /tmp/mechet-ablation/suite.yaml
          grep -q length_matched_irrelevant /tmp/mechet-ablation/suite/trace_length_matched_irrelevant.jsonl
          grep -q retrieve_primitives /tmp/mechet-ablation/suite/trace_structured_anchors.jsonl
          test "$(grep -c retrieve_textbook_guidance /tmp/mechet-ablation/suite/trace_structured_anchors.jsonl)" -eq 0
          grep -q '"endpoint_source": "direct_answer"' /tmp/mechet-ablation/suite/direct_textbook_rag.jsonl
      - name: Validate matched suite and Tool-SFT dry-run
        run: |
          python scripts/validate_experiment_contract.py \
            --condition none=/tmp/mechet-ablation/suite/trace_no_knowledge.jsonl \
            --condition irrelevant=/tmp/mechet-ablation/suite/trace_length_matched_irrelevant.jsonl \
            --condition textbook=/tmp/mechet-ablation/suite/trace_textbook_rag.jsonl \
            --condition anchors=/tmp/mechet-ablation/suite/trace_structured_anchors.jsonl \
            --condition combined=/tmp/mechet-ablation/suite/trace_text_plus_anchors.jsonl \
            --condition direct=/tmp/mechet-ablation/suite/direct_textbook_rag.jsonl \
            --output /tmp/mechet-ablation/contract.json
          cat > /tmp/mechet-ablation/tool_sft.yaml <<'YAML'
          condition_name: textbook
          model_name_or_path: Qwen/Qwen3-0.6B
          train_file: /tmp/mechet-ablation/suite/trace_textbook_rag.jsonl
          output_dir: /tmp/mechet-ablation/output
          training:
            assistant_only_loss: true
          YAML
          python scripts/train_tool_sft.py \
            --config /tmp/mechet-ablation/tool_sft.yaml --dry-run
          python scripts/evaluate_knowledge_ablation.py \
            --condition none=/tmp/mechet-ablation/suite/trace_no_knowledge.jsonl \
            --condition irrelevant=/tmp/mechet-ablation/suite/trace_length_matched_irrelevant.jsonl \
            --condition textbook=/tmp/mechet-ablation/suite/trace_textbook_rag.jsonl \
            --output /tmp/mechet-ablation/summary.json
          grep -q knowledge_direct_reward_violations /tmp/mechet-ablation/summary.json
