name: Apply experiment integrity patches

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/integrity-patch.ready

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experiment-integrity-audits
          fetch-depth: 0

      - name: Wire validators and documentation contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def append_once(path: str, marker: str, block: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if marker not in text:
                  file.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          # Wire common source validation and quality metadata into the downloader.
          replace(
              'scripts/download_mechanistic_sources.py',
              'from pathlib import Path\nimport re\nimport time',
              'from pathlib import Path\nimport re\nimport sys\nimport time',
          )
          replace(
              'scripts/download_mechanistic_sources.py',
              'except ImportError as exc:  # pragma: no cover\n    raise RuntimeError("install mechet[knowledge]") from exc\n\nDEFAULT_USER_AGENT',
              'except ImportError as exc:  # pragma: no cover\n    raise RuntimeError("install mechet[knowledge]") from exc\n\nREPO = Path(__file__).resolve().parents[1]\nsys.path.insert(0, str(REPO / "src"))\n\nfrom mechet.source_health import source_quality_metadata, validate_mediawiki_result\n\nDEFAULT_USER_AGENT',
          )
          replace(
              'scripts/download_mechanistic_sources.py',
              '    record.update(extra or {})\n    return record',
              '    record.update(source_quality_metadata(row))\n    record.update(extra or {})\n    return record',
          )
          replace(
              'scripts/download_mechanistic_sources.py',
              '    local = _local_mediawiki(row, title, import_dir)\n    if local is not None:\n        return local',
              '    local = _local_mediawiki(row, title, import_dir)\n    if local is not None:\n        backend = str(local.get("retrieval_backend") or "local_import")\n        local["validation"] = validate_mediawiki_result(\n            local, configured_title=title, backend=backend\n        )\n        return local',
          )
          replace(
              'scripts/download_mechanistic_sources.py',
              '            result = functions[backend](row, title, options)\n            result["backend_errors"] = errors\n            return result',
              '            result = functions[backend](row, title, options)\n            result["validation"] = validate_mediawiki_result(\n                result, configured_title=title, backend=backend\n            )\n            result["backend_errors"] = errors\n            return result',
          )
          replace(
              'scripts/download_mechanistic_sources.py',
              '            {"revision_id": value.get("revision_id"), "retrieval_backend": value.get("retrieval_backend")},',
              '            {\n                "revision_id": value.get("revision_id"),\n                "revision_timestamp": value.get("revision_timestamp"),\n                "retrieval_backend": value.get("retrieval_backend"),\n                "configured_title": str(title),\n                "resolved_title": value.get("title"),\n                "content_characters": len(str(value.get("wikitext") or "")),\n                **source_quality_metadata(row, title=str(title)),\n            },',
          )

          # Keep existing downloader tests compatible with the common minimum-content contract.
          test_path = Path('tests/test_primitive_source_download.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              '"wikitext": "content",',
              '"wikitext": "A revisioned textbook passage describing a mechanistic pathway and its electron-flow context. " * 2,',
          )
          test_text = test_text.replace(
              '"local wikitext", encoding="utf-8"',
              '"A locally imported textbook passage with sufficient mechanistic content for validation. " * 2, encoding="utf-8"',
          )
          test_text = test_text.replace(
              'assert result["wikitext"] == "local wikitext"',
              'assert "locally imported textbook passage" in result["wikitext"]',
          )
          integration_test = '''\n\ndef test_mediawiki_invalid_success_falls_through_to_next_backend(monkeypatch):\n    monkeypatch.setattr(\n        module,\n        "_mediawiki_rest",\n        lambda row, title, options: {\n            "title": title,\n            "revision_id": None,\n            "wikitext": "",\n            "retrieval_backend": "rest",\n        },\n    )\n    monkeypatch.setattr(\n        module,\n        "_mediawiki_export",\n        lambda row, title, options: {\n            "title": title,\n            "revision_id": 9,\n            "wikitext": "A valid exported mechanistic textbook passage with enough content for the common validator. " * 2,\n            "retrieval_backend": "export",\n            "retrieval_url": "https://example/export",\n        },\n    )\n    result = module._download_mediawiki_page(\n        {},\n        "Organic Chemistry/Ketones and aldehydes",\n        module.NetworkOptions(),\n        ["rest", "export"],\n        None,\n    )\n    assert result["retrieval_backend"] == "export"\n    assert result["validation"]["content_nonempty"]\n    assert result["backend_errors"][0]["backend"] == "rest"\n'''
          if 'test_mediawiki_invalid_success_falls_through_to_next_backend' not in test_text:
              test_text = test_text.rstrip() + integration_test + '\n'
          test_path.write_text(test_text, encoding='utf-8')

          # Add a compact public status table without duplicating the full matrix.
          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          status_block = '''## Project status\n\n| Layer | Current status |\n|---|---|\n| Deterministic executor and trace-owned runtime | Implemented and CI-tested |\n| Replay-verified Tool-SFT data contract | Implemented; real-model overfit pending |\n| H1 causal-faithfulness result | **Not established** |\n| H2 compositional-generalization result | **Not established** |\n| H3 evidence-benefit result | **Not established** |\n| Paper-scale benchmark and checkpoints | Pending |\n\nSee [`docs/STATUS_MATRIX.md`](docs/STATUS_MATRIX.md) for the complete implementation/evidence matrix. A working infrastructure component is not a positive scientific result.\n'''
          if '## Project status' not in readme_text:
              readme_text = readme_text.replace('## Research thesis', status_block + '\n## Research thesis', 1)
              readme.write_text(readme_text, encoding='utf-8')

          # Protect the additional integrity documentation test in docs CI.
          docs_workflow = Path('.github/workflows/docs-tests.yml')
          docs_text = docs_workflow.read_text(encoding='utf-8')
          if 'tests/test_integrity_documentation_contract.py' not in docs_text:
              docs_text = docs_text.replace(
                  '      - "tests/test_documentation_integrity.py"',
                  '      - "tests/test_documentation_integrity.py"\n      - "tests/test_integrity_documentation_contract.py"',
              )
              docs_text = docs_text.replace(
                  'tests/test_documentation_contract.py tests/test_documentation_integrity.py',
                  'tests/test_documentation_contract.py tests/test_documentation_integrity.py tests/test_integrity_documentation_contract.py',
              )
              docs_workflow.write_text(docs_text, encoding='utf-8')

          # Avoid assuming a repository label already exists in the scheduled workflow.
          source_workflow = Path('.github/workflows/source-health-check.yml')
          source_text = source_workflow.read_text(encoding='utf-8')
          source_text = source_text.replace(", labels: ['source-health']", '')
          source_workflow.write_text(source_text, encoding='utf-8')

          append_once(
              'docs/TRACE_FAITHFULNESS.md',
              '## Statistical identification',
              '''## Statistical identification\n\nThe primary H1 comparison uses frozen target IDs as paired units. `evaluate_faithfulness.py` reports a paired bootstrap confidence interval, an exact McNemar test, and Holm correction over the declared intervention family. A final claim additionally requires independent training-seed aggregation through `scripts/aggregate_evaluation_seeds.py`; a single positive point estimate is insufficient.''',
          )
          append_once(
              'docs/KNOWLEDGE_ABLATIONS.md',
              '## Statistical identification and multi-seed aggregation',
              '''## Statistical identification and multi-seed aggregation\n\nEach primary H3 contrast is evaluated on the same frozen IDs with paired bootstrap confidence intervals and exact McNemar tests. The four primary evidence contrasts are corrected with Holm's method. Final evidence claims require independent-seed aggregation via `scripts/aggregate_evaluation_seeds.py`, a confidence-interval lower bound above the declared minimum effect, and consistent effect direction across seeds.''',
          )
          append_once(
              'docs/PROOF_EQUIVALENCE.md',
              '## Automated structural-overlap audit',
              '''## Automated structural-overlap audit\n\n`build_mechcomp_ood.py` now audits exact product, structural-precursor and full reaction overlap; Murcko scaffold overlap; reaction-center context overlap; reaction-family overlap; and Morgan/Tanimoto near duplicates. Valid and test rows receive `metadata.mechcomp_structural_overlap`, and the manifest reports composition-OOD strata for scaffold-seen/unseen, center-seen/unseen and family-seen/unseen subsets. Composition novelty must not be interpreted as scaffold or family novelty.''',
          )
          append_once(
              'docs/EXECUTION_PLAN.md',
              '## Integrity utilities added after the pilot contract',
              '''## Integrity utilities added after the pilot contract\n\nBefore a final H1/H2/H3 result package:\n\n```bash\npython scripts/check_documentation_integrity.py --output outputs/documentation_integrity.json\npython scripts/check_source_health.py --output outputs/source_health.json\npython scripts/aggregate_evaluation_seeds.py \\\n  --evaluation outputs/seed1/evaluation.json \\\n  --evaluation outputs/seed2/evaluation.json \\\n  --evaluation outputs/seed3/evaluation.json \\\n  --output outputs/multi_seed_summary.json\n```\n\nThe H2 split manifest must include the structural-overlap audit and stratified composition-OOD counts. H1/H3 result artifacts must include paired uncertainty and corrected tests; the multi-seed aggregate must satisfy the declared seed-count, interval and direction gates.''',
          )
          PY

      - name: Commit patched files and remove one-time workflow
        shell: bash
        run: |
          rm .github/integrity-patch.ready
          rm .github/workflows/apply-integrity-patches.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire integrity validators into runtime and documentation'
          git push origin HEAD:agent/experiment-integrity-audits
