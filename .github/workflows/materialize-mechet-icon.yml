name: Materialize MechET icon

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/icon-materialize.ready

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/use-original-mechet-icon
          fetch-depth: 0

      - name: Decode the uploaded PNG and update README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          parts = sorted(Path('.github/icon-chunks').glob('part-*.txt'))
          if len(parts) != 8:
              raise SystemExit(f'Expected 8 icon chunks, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Decoded asset is not a PNG')
          expected = Path('.github/icon-materialize.ready').read_text(encoding='utf-8').strip()
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'PNG SHA-256 mismatch: {actual} != {expected}')

          icon = Path('docs/assets/mechet-icon.png')
          icon.write_bytes(raw)

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('docs/assets/mechet-icon.svg', 'docs/assets/mechet-icon.png')
          readme.write_text(text, encoding='utf-8')

          assets_readme = Path('docs/assets/README.md')
          if assets_readme.exists():
              asset_text = assets_readme.read_text(encoding='utf-8')
              asset_text = asset_text.replace('mechet-icon.svg', 'mechet-icon.png')
              assets_readme.write_text(asset_text, encoding='utf-8')

          old_svg = Path('docs/assets/mechet-icon.svg')
          if old_svg.exists():
              old_svg.unlink()
          PY

      - name: Verify binary asset
        shell: bash
        run: |
          file docs/assets/mechet-icon.png
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/assets/mechet-icon.png')
          assert p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          assert 'docs/assets/mechet-icon.png' in Path('README.md').read_text(encoding='utf-8')
          PY

      - name: Commit the real PNG and remove temporary materialization files
        shell: bash
        run: |
          rm -rf .github/icon-chunks
          rm .github/icon-materialize.ready
          rm .github/workflows/materialize-mechet-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use the user-provided MechET PNG icon'
          git push origin HEAD:agent/use-original-mechet-icon
