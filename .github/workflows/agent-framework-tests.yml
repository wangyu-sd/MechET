name: Agent framework integration tests

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/SCIENTIFIC_THESIS.md"
      - "docs/EXECUTION_PLAN.md"
      - "docs/FRAMEWORK_MIGRATION.md"
      - "docs/TRACE_FAITHFULNESS.md"
      - "docs/KNOWLEDGE_AUGMENTED_AGENT.md"
      - "docs/TOOL_SFT.md"
      - "docs/README.md"
      - "pyproject.toml"
      - "src/mechet/agent_env.py"
      - "src/mechet/electron_flow_trace.py"
      - "src/mechet/trace_agent_env.py"
      - "src/mechet/knowledge_agent_env.py"
      - "src/mechet/proof_to_trace.py"
      - "src/mechet/textbook_*.py"
      - "src/mechet/evidence_context.py"
      - "src/mechet/adversarial.py"
      - "src/mechet/syntheseus_adapter.py"
      - "scripts/agent_model_init.py"
      - "scripts/train_inverse_agent_trl.py"
      - "scripts/train_inverse_agent_trace.py"
      - "scripts/train_inverse_agent_knowledge.py"
      - "scripts/build_textbook_tool_sft.py"
      - "scripts/mine_bidirectional_hard_negatives.py"
      - "scripts/train_forward_expert_hard_negative.py"
      - "scripts/run_syntheseus_search.py"
      - "configs/agent/**"
      - "configs/knowledge/**"
      - "tests/test_agent_frameworks.py"
      - "tests/test_agent_model_init.py"
      - "tests/test_trace_proof_binding.py"
      - "tests/test_knowledge_agent_env.py"
      - "tests/test_proof_to_trace.py"
      - ".github/workflows/agent-framework-tests.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "src/mechet/agent_env.py"
      - "src/mechet/electron_flow_trace.py"
      - "src/mechet/trace_agent_env.py"
      - "src/mechet/knowledge_agent_env.py"
      - "src/mechet/proof_to_trace.py"
      - "scripts/agent_model_init.py"
      - "scripts/train_inverse_agent_trace.py"
      - "scripts/train_inverse_agent_knowledge.py"
      - "scripts/build_textbook_tool_sft.py"
      - "configs/agent/**"
      - "configs/knowledge/**"
      - "tests/test_agent_model_init.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,knowledge]"
      - name: Compile framework adapters
        run: |
          python -m py_compile \
            src/mechet/agent_env.py \
            src/mechet/electron_flow_trace.py \
            src/mechet/trace_agent_env.py \
            src/mechet/knowledge_agent_env.py \
            src/mechet/proof_to_trace.py \
            src/mechet/textbook_store.py \
            src/mechet/textbook_retriever.py \
            src/mechet/evidence_context.py \
            src/mechet/adversarial.py \
            src/mechet/syntheseus_adapter.py \
            scripts/agent_model_init.py \
            scripts/train_inverse_agent_trl.py \
            scripts/train_inverse_agent_trace.py \
            scripts/train_inverse_agent_knowledge.py \
            scripts/build_textbook_tool_sft.py \
            scripts/mine_bidirectional_hard_negatives.py \
            scripts/train_forward_expert_hard_negative.py \
            scripts/run_syntheseus_search.py
      - name: Run environment, lineage, trace, knowledge, and candidate-pool tests
        run: |
          pytest -q \
            tests/test_agent_frameworks.py \
            tests/test_agent_model_init.py \
            tests/test_trace_proof_binding.py \
            tests/test_knowledge_agent_env.py \
            tests/test_proof_to_trace.py \
            tests/test_documentation_contract.py
      - name: Exercise legacy, trace-owned, and knowledge dry-runs
        run: |
          mkdir -p /tmp/mechet-agent
          cat > /tmp/mechet-agent/train.jsonl <<'EOF'
          {"id":"smoke-1","target_smiles":"[CH3:1][C:2](=[O:3])[CH3:4]","expected_precursor":"[CH3:1][C:2](=[O:3])[CH3:4]"}
          EOF
          cat > /tmp/mechet-agent/passages.jsonl <<'EOF'
          {"passage_id":"carbonyl-1","title":"Carbonyl addition","text":"A nucleophile donates an electron pair to the electrophilic carbonyl carbon while the pi bond shifts toward oxygen.","source_id":"open_textbook","locator":"chapter/carbonyl","revision":"r1","license":"CC-BY-4.0","source_url":"https://example.org","evidence_sha256":"placeholder","topics":["carbonyl"]}
          EOF
          python - <<'PY'
          import hashlib, json, pathlib
          path = pathlib.Path('/tmp/mechet-agent/passages.jsonl')
          row = json.loads(path.read_text())
          row['evidence_sha256'] = hashlib.sha256(row['text'].encode()).hexdigest()
          path.write_text(json.dumps(row)+'\n')
          PY
          cat > /tmp/mechet-agent/base_config.yaml <<'EOF'
          model_name_or_path: Qwen/Qwen3-0.6B
          train_file: /tmp/mechet-agent/train.jsonl
          output_dir: /tmp/mechet-agent/output
          environment:
            max_tool_calls: 10
            require_tool_use: true
          EOF
          cat > /tmp/mechet-agent/knowledge_config.yaml <<'EOF'
          model_name_or_path: Qwen/Qwen3-0.6B
          train_file: /tmp/mechet-agent/train.jsonl
          output_dir: /tmp/mechet-agent/output
          textbook_corpus_path: /tmp/mechet-agent/passages.jsonl
          environment:
            max_tool_calls: 10
            require_tool_use: true
            require_textbook_corpus: true
          EOF
          python scripts/train_inverse_agent_trl.py \
            --config /tmp/mechet-agent/base_config.yaml --dry-run
          python scripts/train_inverse_agent_trace.py \
            --config /tmp/mechet-agent/base_config.yaml --dry-run \
            | tee /tmp/mechet-agent/trace_report.json
          python scripts/train_inverse_agent_knowledge.py \
            --config /tmp/mechet-agent/knowledge_config.yaml --dry-run \
            | tee /tmp/mechet-agent/knowledge_report.json
          grep -q checkpoint_lineage /tmp/mechet-agent/trace_report.json
          grep -q checkpoint_lineage /tmp/mechet-agent/knowledge_report.json
      - name: Exercise replay-verified Tool-SFT build and coverage report
        run: |
          mkdir -p /tmp/mechet-tool-sft
          cp /tmp/mechet-agent/passages.jsonl /tmp/mechet-tool-sft/passages.jsonl
          python - <<'PY'
          import json
          from mechet.proof_program import ChargeAction, ProofEdge, ProofProgram, format_proof_output
          program = ProofProgram(
              target_smiles='[CH3:1][OH:2]',
              roots={'s0': []},
              precursor_state_id='s1',
              edges=[ProofEdge('s0','s1',imports=['[Br-:3]'],bonds=[(1,2,-1),(1,3,1)],lone_pairs=[(2,2),(3,-2)],charges=[ChargeAction(2,0,-1),ChargeAction(3,-1,0)])],
          )
          with open('/tmp/mechet-tool-sft/proofs.jsonl','w') as handle:
              handle.write(json.dumps({'id':'sn2','proof':format_proof_output(program),'mechanism_class':'nucleophilic substitution'})+'\n')
              handle.write(json.dumps({'id':'missing-proof','mechanism_class':'unknown'})+'\n')
          PY
          python scripts/build_textbook_tool_sft.py \
            --input /tmp/mechet-tool-sft/proofs.jsonl \
            --corpus /tmp/mechet-tool-sft/passages.jsonl \
            --output /tmp/mechet-tool-sft/train.jsonl
          grep -q finish_trace /tmp/mechet-tool-sft/train.jsonl
          grep -q environment_owned_trace /tmp/mechet-tool-sft/train.jsonl
          grep -q conversion_rate /tmp/mechet-tool-sft/train.report.json
          grep -q failure_codes /tmp/mechet-tool-sft/train.report.json
          grep -q family_coverage /tmp/mechet-tool-sft/train.report.json
          grep -q PROOF_MISSING /tmp/mechet-tool-sft/train.quarantine.jsonl
      - name: Check optional CLI schemas
        run: |
          python scripts/build_textbook_tool_sft.py --help
          python scripts/run_syntheseus_search.py --help
          python scripts/mine_bidirectional_hard_negatives.py --help
          python scripts/train_forward_expert_hard_negative.py --help
