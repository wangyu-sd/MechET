name: CRN-Qwen hybrid contracts
on:
  pull_request:
    paths:
      - "src/mechet/crn_graph_bridge.py"
      - "src/mechet/graph_endpoint_rl.py"
      - "src/mechet/graph_earho.py"
      - "scripts/train_crn_graph_earho.py"
      - "tests/test_graph_earho_contract.py"
      - "tests/test_graph_earho_runtime_contract.py"
      - "scripts/run_crn_qwen_hybrid.py"
      - "scripts/pr83_resume.py"
      - "tests/test_pr83_resume.py"
      - "scripts/run_pr83_formal_campaign.py"
      - "tests/test_pr83_formal_campaign.py"
      - "scripts/train_crn_graph_endpoint_rl.py"
      - "tests/test_crn_graph_hybrid_contract.py"
      - ".github/workflows/crn-qwen-hybrid-contracts.yml"
  push:
    branches: [main]
    paths:
      - "src/mechet/crn_graph_bridge.py"
      - "src/mechet/graph_endpoint_rl.py"
      - "src/mechet/graph_earho.py"
      - "scripts/train_crn_graph_earho.py"
      - "tests/test_graph_earho_contract.py"
      - "scripts/run_crn_qwen_hybrid.py"
      - "scripts/train_crn_graph_endpoint_rl.py"
      - "tests/test_crn_graph_hybrid_contract.py"
jobs:
  lightweight-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile opt-in code
        run: |
          python -m compileall -q src/mechet/crn_graph_bridge.py src/mechet/graph_endpoint_rl.py \
            scripts/run_crn_qwen_hybrid.py scripts/train_crn_graph_endpoint_rl.py scripts/train_crn_graph_earho.py scripts/pr83_resume.py src/mechet/graph_earho.py
      - name: Run pure contract tests
        run: |
          python -m unittest discover -s tests -p test_crn_graph_hybrid_contract.py -v
          python -m unittest discover -s tests -p test_pr83_resume.py -v
          python -m unittest discover -s tests -p test_pr83_formal_campaign.py -v
          python -m unittest discover -s tests -p test_graph_earho_contract.py -v
          python -m unittest discover -s tests -p test_graph_earho_runtime_contract.py -v
